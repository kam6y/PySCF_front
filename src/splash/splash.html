<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PySCF_front - Loading</title>
    <!-- CSS and JS will be injected by HtmlWebpackPlugin -->
  </head>
  <body>
    <div class="splash-container">
      <!-- タイトル -->
      <h1 class="splash-title">PySCF_front</h1>

      <!-- メインコンテンツエリア -->
      <div class="splash-content">
        <!-- ステージメッセージ -->
        <div class="stage-message" id="stageMessage">
          Initializing PySCF_front...
        </div>

        <!-- プログレスバー（インデターミネート） -->
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-bar-fill"></div>
          </div>
        </div>

        <!-- 詳細メッセージ（リトライカウントなど） -->
        <div class="detail-message" id="detailMessage"></div>
      </div>

      <!-- エラーセクション -->
      <div class="error-container" id="errorContainer" style="display: none;">
        <div class="error-icon">⚠️</div>
        <div class="error-message" id="errorMessage"></div>
        <div class="error-info">The application will close in 5 seconds...</div>
      </div>
    </div>
    <!-- JS will be injected by HtmlWebpackPlugin -->
  </body>
</html>
