        '500':
          description: Failed to update chat session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      security:
        - AuthToken: []
      summary: Delete chat session
      description: Delete a chat session and all its messages
      operationId: deleteChatSession
      parameters:
        - name: sessionId
          in: path
          required: true
