openapi: 3.0.3
info:
  title: PySCF_frontlication API
  description: |
    Backend API for managing quantum chemistry calculations using PySCF.
    
    ## Discriminated Union Pattern for Calculation Requests
    
    This API uses **discriminated unions** (also known as tagged unions) to provide type-safe calculation request schemas.
    Each calculation method (DFT, HF, MP2, CCSD, CCSD(T), TDDFT, CASCI, CASSCF) has its own dedicated schema with 
    method-specific parameters.
    
    ### Design Principles
    
    1. **Type Safety**: The `calculation_method` field acts as a discriminator that determines which schema applies
    2. **Single Source of Truth**: Each method's parameters are defined once in the schema and enforced by backend validation
    3. **Method-Specific Parameters**: Parameters like `exchange_correlation` (DFT/TDDFT only), `ncas` (CASCI/CASSCF only), 
       or `frozen_core` (CCSD/CCSD(T) only) are only present in their applicable schemas
    4. **Explicit Constraints**: Disabled parameters (e.g., `optimize_geometry` for TDDFT) use `enum: [false]` to enforce restrictions
    
    ### Schema Structure
    
    ```yaml
    QuantumCalculationRequest:
      oneOf:
        - $ref: '#/components/schemas/DFTCalculationRequest'
        - $ref: '#/components/schemas/HFCalculationRequest'
        - $ref: '#/components/schemas/MP2CalculationRequest'
        # ... (all 8 method-specific schemas)
      discriminator:
        propertyName: calculation_method
    ```
    
    Each method-specific schema extends `CalculationRequestBase` (common parameters) and adds its own unique parameters.
    
    ### Usage Examples
    
    **DFT Calculation Request:**
    ```json
    {
      "calculation_method": "DFT",
      "xyz": "H 0 0 0\nH 0 0 0.74",
      "exchange_correlation": "B3LYP",
      "basis_function": "6-31G(d)",
      "optimize_geometry": true,
      "charges": 0,
      "spin": 0
    }
    ```
    
    **CASCI Calculation Request:**
    ```json
    {
      "calculation_method": "CASCI",
      "xyz": "O 0 0 0\nH 0.757 0.586 0\nH -0.757 0.586 0",
      "basis_function": "6-31G(d)",
      "ncas": 6,
      "nelecas": 8,
      "optimize_geometry": false,
      "charges": 0,
      "spin": 0
    }
    ```
    
    ### Backend Validation
    
    The backend enforces parameter applicability:
    - ✅ Accepts: DFT request with `exchange_correlation`
    - ❌ Rejects: DFT request with `ncas` (only valid for CASCI/CASSCF)
    - ❌ Rejects: TDDFT request with `optimize_geometry: true` (disabled for TDDFT)
    
    See the `/api/quantum/supported-parameters` endpoint for runtime parameter constraints and method defaults.

    ### Authentication

    Runtime API routes are protected by the `X-Auth-Token` header when `PYSCF_AUTH_TOKEN` is configured.
    Development-only API documentation routes (`/api-docs` and `/api-docs/spec.json`) are intentionally not part of this OpenAPI contract.
    
  version: 0.1.7-beta
  license:
    name: Apache-2.0
    url: https://opensource.org/licenses/Apache-2.0

servers:
  - url: http://127.0.0.1:5000
    description: Local development server

paths:
  /health:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      summary: Health check endpoint
      description: Check if the API server is running
      operationId: healthCheck
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/pubchem/search:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    post:
      security:
        - AuthToken: []
      summary: Search PubChem for compounds
      description: Search PubChem by name, CID, or formula and return 3D structure in XYZ format
      operationId: searchPubChem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PubChemSearchRequest'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: Compound found and XYZ generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PubChemSearchResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Compound not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/smiles/convert:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    post:
      security:
        - AuthToken: []
      summary: Convert SMILES to XYZ format
      description: Convert a SMILES string to 3D XYZ molecular structure
      operationId: convertSmiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMILESConvertRequest'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: SMILES converted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMILESConvertResponse'
        '400':
          description: Invalid SMILES string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/pubchem/validate:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    post:
      security:
        - AuthToken: []
      summary: Validate XYZ format
      description: Validate an XYZ format string
      operationId: validateXYZ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XYZValidateRequest'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: XYZ validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XYZValidateResponse'
        '400':
          description: Invalid request (e.g., XYZ string exceeds maximum length)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculate:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    post:
      security:
        - AuthToken: []
      summary: Start quantum chemistry calculation
      description: Start a calculation in the background
      operationId: startCalculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantumCalculationRequest'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '202':
          description: Calculation queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCalculationResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to queue calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculations:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      summary: List calculations with optional filtering
      description: Get a list of calculation directories with optional filtering by name, status, method, basis set, and date range. Filtering is performed at the file system level for optimal performance.
      operationId: listCalculations
      parameters:
        - name: name_query
          in: query
          required: false
          schema:
            type: string
          description: Partial match search in calculation name (case-insensitive)
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, completed, error, waiting, pausing, paused]
          description: Filter by calculation status
        - name: calculation_method
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CalculationMethod'
          description: Filter by calculation method
        - name: basis_function
          in: query
          required: false
          schema:
            type: string
          description: Filter by basis set (case-insensitive)
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start date for date range filtering (ISO format YYYY-MM-DD)
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date for date range filtering (ISO format YYYY-MM-DD)
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: List of calculations matching filter criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationListResponse'
        '500':
          description: Failed to list calculations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculations/updates/stream:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      tags:
        - Quantum Calculation
      summary: Stream calculation updates
      operationId: streamCalculationUpdates
      description: |
        Opens a Server-Sent Events stream for all calculation updates.
        Each event line contains a JSON `CalculationUpdateStreamEvent`.
      responses:
        '200':
          description: Successfully opened a calculation update SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/quantum/calculations/{calculationId}/updates/stream:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      tags:
        - Quantum Calculation
      summary: Stream updates for one calculation
      operationId: streamCalculationUpdatesForCalculation
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
      description: |
        Opens a Server-Sent Events stream for one calculation and emits the
        current calculation payload before future updates.
      responses:
        '200':
          description: Successfully opened a calculation-specific SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/quantum/status:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      summary: Get calculation system status
      description: Get current process pool and host system status for quantum calculations
      operationId: getCalculationStatus
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: Calculation system status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationStatusResponse'
        '503':
          description: Process manager temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get calculation system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculations/{calculationId}:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      summary: Get calculation details
      description: Get detailed information about a specific calculation
      operationId: getCalculationDetails
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: Calculation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationDetailsResponse'
        '404':
          description: Calculation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get calculation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      security:
        - AuthToken: []
      summary: Update calculation metadata
      description: Update calculation name and other metadata
      operationId: updateCalculation
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationUpdateRequest'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: Calculation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationUpdateResponse'
        '404':
          description: Calculation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to update calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      security:
        - AuthToken: []
      summary: Delete calculation
      description: Delete a calculation and all its associated files
      operationId: deleteCalculation
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: Calculation deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationDeleteResponse'
        '400':
          description: Calculation cannot be deleted while it is non-terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Calculation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculations/{calculationId}/pause:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    post:
      security:
        - AuthToken: []
      summary: Pause a running calculation
      description: Safely pause a running calculation after the current SCF iteration completes. The calculation can be resumed later from the checkpoint.
      operationId: pauseCalculation
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '202':
          description: Pause request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseCalculationResponse'
        '400':
          description: Calculation is not in a pausable state (not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Calculation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to pause calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculations/{calculationId}/resume:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    post:
      security:
        - AuthToken: []
      summary: Resume a paused calculation
      description: Resume a paused calculation from its checkpoint file. The calculation will continue from where it was paused.
      operationId: resumeCalculation
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '202':
          description: Resume request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeCalculationResponse'
        '400':
          description: Calculation cannot be resumed (not paused, no checkpoint available, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Calculation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to resume calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculations/{calculationId}/orbitals:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      summary: Get molecular orbital information
      description: Get list of all molecular orbitals with energies and indices
      operationId: getOrbitals
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: Molecular orbital information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrbitalsResponse'
        '404':
          description: Calculation not found or no orbital data available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get orbital information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculations/{calculationId}/orbitals/{orbitalIndex}/cube:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      summary: Generate and get molecular orbital CUBE file
      description: Generate CUBE file for specific molecular orbital visualization
      operationId: getOrbitalCube
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
        - name: orbitalIndex
          in: path
          required: true
          description: Molecular orbital index
          schema:
            type: integer
            minimum: 0
        - name: gridSize
          in: query
          required: false
          description: Grid size for CUBE file generation (default 80)
          schema:
            type: integer
            minimum: 40
            maximum: 120
            default: 80
        - name: isovaluePos
          in: query
          required: false
          description: Positive isovalue for orbital visualization (default 0.02)
          schema:
            type: number
            minimum: 0.001
            maximum: 0.1
            default: 0.02
        - name: isovalueNeg
          in: query
          required: false
          description: Negative isovalue for orbital visualization (default -0.02)
          schema:
            type: number
            minimum: -0.1
            maximum: -0.001
            default: -0.02
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: Orbital CUBE file data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrbitalCubeResponse'
        '404':
          description: Calculation or orbital not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate orbital CUBE file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculations/{calculationId}/orbitals/cube-files:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      summary: List CUBE files for a calculation
      description: List all saved CUBE files for molecular orbitals in a calculation
      operationId: listCubeFiles
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: CUBE files list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CubeFilesListResponse'
        '404':
          description: Calculation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve CUBE files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      security:
        - AuthToken: []
      summary: Delete CUBE files for a calculation
      description: Delete CUBE files for specific orbital or all orbitals in a calculation
      operationId: deleteCubeFiles
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
        - name: orbital_index
          in: query
          required: false
          description: Specific orbital index to delete (if not provided, deletes all)
          schema:
            type: integer
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: CUBE files deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CubeFilesDeleteResponse'
        '404':
          description: Calculation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete CUBE files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/calculations/{calculationId}/ir-spectrum:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
    get:
      security:
        - AuthToken: []
      summary: Generate IR spectrum for a calculation
      description: Generate theoretical IR spectrum from vibrational frequency data with scale factor corrections and Lorentzian broadening
      operationId: getIRSpectrum
      parameters:
        - name: calculationId
          in: path
          required: true
          description: Unique calculation ID. Must be a single path segment; empty, `.`, `..`, slash, and backslash are not allowed.
          schema:
            type: string
            pattern: '^(?!\.{1,2}$)[^/\\]+$'
        - name: broadening_fwhm
          in: query
          required: false
          description: Full width at half maximum for Lorentzian broadening in cm⁻¹
          schema:
            type: number
            format: float
            default: 100.0
            minimum: 0.1
            maximum: 1000.0
        - name: x_min
          in: query
          required: false
          description: Minimum wavenumber for spectrum range in cm⁻¹
          schema:
            type: number
            format: float
            default: 400.0
            minimum: 0.0
            maximum: 4500.0
        - name: x_max
          in: query
          required: false
          description: Maximum wavenumber for spectrum range in cm⁻¹
          schema:
            type: number
            format: float
            default: 4000.0
            maximum: 4500.0
        - name: show_peaks
          in: query
          required: false
          description: Whether to mark individual peaks in the plot
          schema:
            type: boolean
            default: true
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '200':
          description: IR spectrum generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRSpectrumResponse'
        '400':
          description: Invalid parameters or calculation not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Calculation not found or no frequency data available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate IR spectrum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quantum/supported-parameters:
    parameters:
      - $ref: '#/components/parameters/AuthTokenHeader'
