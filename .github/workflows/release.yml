name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            conda-platform: linux-64
            conda-lock-file: .github/conda-locks/pyscf-env-linux-64.lock
          - os: macos-latest
            platform: darwin
            conda-platform: osx-arm64
            conda-lock-file: .github/conda-locks/pyscf-env-osx-arm64.lock

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache conda environment
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-${{ matrix.conda-platform }}-conda-v2-${{ hashFiles('.github/pyscf-env.conda-lock.yml', matrix.conda-lock-file) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.conda-platform }}-conda-v2-

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate-base: true
          use-only-tar-bz2: true
          pkgs-dirs: ~/conda_pkgs_dir
          conda-remove-defaults: true

      - name: Install locked conda environment
        shell: bash -l {0}
        run: |
          conda install -n base -c conda-forge conda-lock=3.0.4 -y
          conda-lock install --name pyscf-env .github/pyscf-env.conda-lock.yml

      - name: Install Node.js dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

          for i in 1 2 3; do
            npm ci --legacy-peer-deps && break || {
              if [ $i -eq 3 ]; then
                echo "npm ci failed after 3 attempts"
                exit 1
              fi
              echo "npm ci failed, retrying (attempt $i/3)..."
              sleep 10
            }
          done

      - name: Verify conda environment
        shell: bash -l {0}
        run: |
          conda activate pyscf-env
          npm run verify-env

      - name: Build application
        shell: bash -l {0}
        run: |
          conda activate pyscf-env
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npm run build:linux
          else
            npm run build
          fi

      - name: Package application
        shell: bash -l {0}
        run: |
          conda activate pyscf-env
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npx electron-builder --linux
          else
            npx electron-builder --mac
          fi
          npm run verify:asar-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
          retention-days: 30

  create-release:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            ./artifacts/release-*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
