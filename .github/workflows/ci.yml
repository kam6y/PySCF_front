name: CI

on:
  push:
    branches: [ main, develop, "ver.*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            conda-platform: linux-64
            conda-lock-file: .github/conda-locks/pyscf-env-linux-64.lock
          - os: macos-latest
            conda-platform: osx-arm64
            conda-lock-file: .github/conda-locks/pyscf-env-osx-arm64.lock

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Cache conda environment
      uses: actions/cache@v4
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-${{ matrix.conda-platform }}-conda-v2-${{ hashFiles('.github/pyscf-env.conda-lock.yml', matrix.conda-lock-file) }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.conda-platform }}-conda-v2-
    
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: ""
        auto-activate-base: true
        use-only-tar-bz2: true
        pkgs-dirs: ~/conda_pkgs_dir
        conda-remove-defaults: true

    - name: Install locked conda environment
      shell: bash -l {0}
      run: |
        conda install -n base -c conda-forge conda-lock=3.0.4 -y
        conda-lock install --name pyscf-env .github/pyscf-env.conda-lock.yml
    
    - name: Install Node.js dependencies
      run: |
        # Configure npm for better network reliability
        npm config set fetch-retries 5
        npm config set fetch-retry-mintimeout 20000
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-timeout 300000

        # Retry npm ci up to 3 times on failure
        for i in 1 2 3; do
          npm ci --legacy-peer-deps && break || {
            if [ $i -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
            echo "npm ci failed, retrying (attempt $i/3)..."
            sleep 10
          }
        done

    - name: Verify conda environment
      shell: bash -l {0}
      run: |
        conda activate pyscf-env
        python scripts/verify-environment.py

    - name: Generate and check OpenAPI artifacts
      shell: bash -l {0}
      run: |
        conda activate pyscf-env
        npm run codegen:check

    - name: Run Python tests
      shell: bash -l {0}
      run: |
        conda activate pyscf-env
        cd src/python
        python -m pytest tests/ -v

    - name: Build application (production)
      shell: bash -l {0}
      run: |
        conda activate pyscf-env
        # Clean build artifacts
        npm run clean:build-artifacts

        # Build Electron renderer/main bundles
        npm run build:electron

        # Build conda-pack (CI version - without conda.sh sourcing)
        # setuptools<75 (providing pkg_resources for conda-pack) is pinned
        # in .github/environment.yml, which propagates into the conda lock
        # file via conda-lock — no separate pip install needed.
        rm -rf conda_env
        conda-pack -o conda_env.tar.gz
        mkdir -p conda_env
        tar -xzf conda_env.tar.gz -C conda_env
        rm conda_env.tar.gz
        # Initialize conda environment (fix shebangs)
        (./conda_env/bin/conda-unpack || echo "Warning: conda-unpack encountered errors but continuing...")
        echo "Cleaning up development files from conda_env..."
        find conda_env -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        find conda_env -type f \( -name "*.pyc" -o -name "*.pyo" -o -name "*.pyd" \) -delete
        find conda_env/lib/python*/site-packages -maxdepth 2 -type d \( -name "tests" -o -name "test" \) -exec rm -rf {} + 2>/dev/null || true
        rm -rf conda_env/etc/conda/test-files 2>/dev/null || true
        find conda_env -type f -name ".coverage*" -delete 2>/dev/null || true
        find conda_env -name "*.egg-info" -type d -exec rm -rf {} + 2>/dev/null || true
        echo "✓ Cleanup completed"

        # Validate build
        python scripts/validate-build-completeness.py

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}
        path: |
          dist/
          conda_env/
        retention-days: 7

  lint-and-type-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install Node.js dependencies
      run: |
        # Configure npm for better network reliability
        npm config set fetch-retries 5
        npm config set fetch-retry-mintimeout 20000
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-timeout 300000

        # Retry npm ci up to 3 times on failure
        for i in 1 2 3; do
          npm ci --legacy-peer-deps && break || {
            if [ $i -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
            echo "npm ci failed, retrying (attempt $i/3)..."
            sleep 10
          }
        done
    
    - name: Audit npm dependencies (advisory, non-blocking)
      continue-on-error: true
      run: npm audit --audit-level=high

    - name: Audit Python dependencies (advisory, non-blocking)
      continue-on-error: true
      run: |
        # Isolated runner-Python audit via pipx — does NOT touch the conda
        # pyscf-env that gets conda-packed/shipped (SEC-002 safe).
        # KNOWN GAP: only the PyPI-resolvable deps listed below are covered.
        # conda-channel packages (numpy, pyscf, fastapi, rdkit, etc.) and
        # the git-pinned pyscf-properties are NOT scanned by this step.
        # Full conda vulnerability scanning needs separate tooling
        # (e.g. OSV-Scanner with conda-lock support) — tracked as follow-up.
        cat > "$RUNNER_TEMP/py-audit-reqs.txt" <<'EOF'
        datamodel-code-generator==0.33.0
        google-generativeai==0.8.6
        EOF
        pipx run pip-audit -r "$RUNNER_TEMP/py-audit-reqs.txt"

    - name: Type check TypeScript
      run: npx tsc --noEmit

    - name: Run Electron main tests
      run: npm run test:main
    
    - name: Run frontend tests
      run: npm run test:web

    - name: Check code formatting
      run: npm run format:check
