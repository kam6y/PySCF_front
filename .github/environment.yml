name: pyscf-env
channels:
  - conda-forge
dependencies:
  - python=3.12.11
  # Core scientific computing libraries
  - numpy>=2.0,<2.4  # ARM Macでのlongdouble精度問題に対応（最新2.3系は許可）
  - pyscf=2.10.0
  - rdkit=2025.03.6
  - geometric=1.1
  - ase=3.26.0
  # Bioinformatics (for PubMed search)
  - biopython=1.85
  # Web framework and networking
  - fastapi=0.136.1
  - uvicorn=0.47.0
  - python-socketio=5.16.1
  - gunicorn=23.0.0
  - requests=2.32.5
  - pydantic=2.11.7
  - threadpoolctl=3.6.0
  # System monitoring and resource management
  - psutil=7.0.0
  # Development and testing dependencies
  - pytest=8.4.2
  - pytest-mock=3.14.0
  - pytest-cov=6.0.0
  - pip=25.2
  # Environment packaging for distribution
  - setuptools<75
  - conda-pack=0.8.1
  - pip:
    # PySCF extensions
    - git+https://github.com/pyscf/properties  # IR/Raman intensity calculations
    # Code generation and build tools
    - datamodel-code-generator==0.33.0
    # File system monitoring
    - watchdog==6.0.0
    # YAML parsing for OpenAPI spec
    - pyyaml==6.0.1
    # AI Chat integration (Gemini API)
    - google-generativeai>=0.8.0
