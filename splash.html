<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- H7/J1: CSP matches index.html so devCspRelaxPlugin's marker check works for both files. Stripped in production by stripMetaCspPlugin (H2). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PySCF_front - Loading</title>
    <style data-splash-critical>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }

      .splash-container {
        width: 600px;
        height: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }

      .splash-title {
        margin-bottom: 40px;
        color: #50d4f5;
        font-size: 32px;
        text-align: center;
      }

      .splash-content {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .stage-message {
        min-height: 24px;
        color: #333;
        font-size: 16px;
        font-weight: 500;
        text-align: center;
      }

      .progress-container {
        width: 100%;
        padding: 0 20px;
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        overflow: hidden;
        position: relative;
        background-color: #e0e0e0;
        border-radius: 4px;
      }

      .progress-bar-fill {
        width: 40%;
        height: 100%;
        position: absolute;
        background: linear-gradient(90deg, #50d4f5, #22b9e7);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <h1 class="splash-title">Welcome to PySCF_front!</h1>

      <div class="splash-content">
        <div class="stage-message" id="stageMessage">
          Initializing PySCF_front...
        </div>

        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-bar-fill"></div>
          </div>
        </div>

        <div class="detail-message" id="detailMessage"></div>
      </div>

      <div class="error-container" id="errorContainer" style="display: none">
        <div class="error-icon">!</div>
        <div class="error-message" id="errorMessage"></div>
        <div class="error-info">The application will close in 5 seconds...</div>
      </div>
    </div>
    <script type="module" src="/src/splash/splash.ts"></script>
  </body>
</html>
